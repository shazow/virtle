name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMPDIR: /tmp

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check module files
        run: go mod tidy -diff

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  nix:
    name: Nix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: /tmp

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Validate Nix package
        run: nix build .#virtle --no-link

      # `nix flake check` builds only the checks matching the runner and skips
      # the rest with "the check omitted these incompatible systems", so
      # enumerate the checks for whichever system CI handed us and run all of
      # them instead. Building a check derivation runs its checkPhase.
      - name: Run flake checks
        shell: bash
        run: |
          set -euo pipefail
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          mapfile -t checks < <(
            nix eval --json --apply builtins.attrNames ".#checks.$system" |
              jq -r --arg prefix ".#checks.$system." '.[] | $prefix + .'
          )
          echo "Running ${#checks[@]} check(s) for $system: ${checks[*]}"
          nix build --no-link --print-build-logs "${checks[@]}"
