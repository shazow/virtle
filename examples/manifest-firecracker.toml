# A Firecracker microVM: direct boot of an uncompressed kernel with a raw root
# disk. Guest control, SSH, shares, and networking are QEMU-only for now; see
# docs/firecracker.md for what the backend supports.
backend = "firecracker"

[machine]
vcpu = 2
memory = 512

[kernel]
path = "/tmp/vmlinux"
# virtle adds console=ttyS0 (for serial = "print") and reboot=k panic=-1;
# Firecracker appends root=/dev/vda and ro/rw for the first disk.
params = ["pci=off"]
serial = "print"

[[mounts]]
type = "image"
source = "/tmp/rootfs.ext4"
read_only = true
